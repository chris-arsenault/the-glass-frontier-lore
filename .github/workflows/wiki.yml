name: Check worlds and publish wiki

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# The world published to this repository's GitHub wiki. Only one world can go
# there, so the others are validated but not published; when a second world has
# canon worth reading, this moves to a site build with a directory per world.
env:
  PUBLISHED_WORLD: glass-frontier

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Engine tests
        run: make test

      - name: Validate and lint every world with canon
        run: make check-all

  wiki:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate wiki pages
        run: make wiki WORLD=$PUBLISHED_WORLD

      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki_repo

      - name: Update wiki content
        run: |
          # Remove old wiki content (keep .git)
          find wiki_repo -maxdepth 1 -not -name '.git' -not -name 'wiki_repo' -not -path 'wiki_repo' -delete 2>/dev/null || true
          # Copy generated pages into the wiki repo
          cp build/$PUBLISHED_WORLD/wiki/*.md wiki_repo/

      - name: Commit and push wiki changes
        run: |
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit and push if there are changes
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
          else
            git commit -m "Update wiki from ${GITHUB_SHA::8}"
            git push
          fi
