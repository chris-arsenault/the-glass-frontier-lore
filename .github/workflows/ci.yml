name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/review-app/package-lock.json

      - name: Test Lorecraft
        run: make test

      - name: Install review app dependencies
        working-directory: tools/review-app
        run: npm ci

      - name: Check review app
        run: make review-check

      - name: Check every world
        run: make check-all

      - name: Build public and editorial data
        run: make site-data

  application:
    needs: content
    uses: chris-arsenault/ahara/.github/workflows/ci.yml@main
    secrets: inherit
