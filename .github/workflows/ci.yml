name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Test Lorecraft
        run: make test

      - name: Check every world
        run: make check-all

      - name: Build public and editorial data
        run: make site-data

  application:
    needs: content
    uses: chris-arsenault/ahara/.github/workflows/ci.yml@main
    secrets: inherit
