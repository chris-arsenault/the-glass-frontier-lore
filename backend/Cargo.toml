[workspace]
members = ["editorial-api"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
lambda_http = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
