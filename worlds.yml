# The worlds this repository holds. One entry per tenant under worlds/<id>/.
#
#   id        directory name under worlds/
#   title     display name
#   status    active | scaffold — scaffold worlds are not published and are
#             skipped by `make check-all`, normal reader-data builds, and CI;
#             they may contain migration work previewed with SITE_WORLD=<id>
#
# The engine reads this file to resolve `lorecraft --world <id>`.

default: glass-frontier

worlds:
  - id: glass-frontier
    title: The Glass Frontier
    status: active

  - id: ice-remembers
    title: The Ice Remembers
    status: scaffold

  - id: dry-war
    title: The Dry War
    status: active
